services:
  - type: web
    name: gitstory-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FRONTEND_URL
        value: https://gitstory-frontend.onrender.com
      - key: OPENAI_MODEL
        value: gpt-4o-mini

  - type: web
    name: gitstory-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://gitstory-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
